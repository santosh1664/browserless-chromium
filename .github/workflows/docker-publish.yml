name: Publish Chromium Docker Image to GitHub Container Registry

on:
  workflow_call:
    inputs:
      tag:
        description: Tag to publish (for example latest or v2.65.0).
        required: true
        type: string
      node_version:
        description: Optional Node.js version override.
        required: false
        type: string
        default: ''
      npm_version:
        description: Optional npm version override.
        required: false
        type: string
        default: ''
      apt_mirror:
        description: Optional Ubuntu APT mirror.
        required: false
        type: string
        default: ''

permissions:
  contents: read

env:
  BASE_IMAGE: ghcr.io/browserless/base
  CHROMIUM_IMAGE: ghcr.io/browserless/chromium

jobs:
  build-base:
    name: Build base (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux/amd64, runner: ubuntu-26.04, pair: linux-amd64 }
          - {
              platform: linux/arm64,
              runner: ubuntu-26.04-arm,
              pair: linux-arm64,
            }
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push base by digest
        id: build
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ./docker/base/Dockerfile
          platforms: ${{ matrix.platform }}
          no-cache: true
          build-args: |
            APT_MIRROR=${{ inputs.apt_mirror }}
            ${{ inputs.node_version != '' && format('NODE_VERSION={0}', inputs.node_version) || '' }}
            ${{ inputs.npm_version != '' && format('NPM_VERSION={0}', inputs.npm_version) || '' }}
          outputs: type=image,name=${{ env.BASE_IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: digest-base__${{ matrix.pair }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-base:
    name: Merge base manifest
    runs-on: ubuntu-slim
    permissions:
      packages: write
    needs: build-base
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-base__*
          merge-multiple: true
      - uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish base manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          # shellcheck disable=SC2046  # intentional word-splitting: one arg per digest
          docker buildx imagetools create -t "${BASE_IMAGE}:${TAG}" \
            $(printf "${BASE_IMAGE}@sha256:%s " *)
      - run: docker buildx imagetools inspect "${BASE_IMAGE}:${TAG}"

  build-chromium:
    name: Build Chromium (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    needs: merge-base
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux/amd64, runner: ubuntu-26.04, pair: linux-amd64 }
          - { platform: linux/arm64, runner: ubuntu-26.04-arm, pair: linux-arm64 }
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push Chromium by digest
        id: build
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ./docker/chromium/Dockerfile
          platforms: ${{ matrix.platform }}
          pull: true
          no-cache: true
          build-args: VERSION=${{ inputs.tag }}
          outputs: type=image,name=${{ env.CHROMIUM_IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: digest-chromium__${{ matrix.pair }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-chromium:
    name: Merge Chromium manifest
    runs-on: ubuntu-slim
    permissions:
      packages: write
    needs: build-chromium
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-chromium__*
          merge-multiple: true
      - uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Verify both architecture digests
        working-directory: ${{ runner.temp }}/digests
        run: |
          count=$(find . -maxdepth 1 -type f | wc -l | tr -d '[:space:]')
          if [ "$count" -ne 2 ]; then
            echo "::error::Expected 2 Chromium architecture digests, found $count."
            exit 1
          fi
      - name: Publish Chromium manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          # shellcheck disable=SC2046  # intentional word-splitting: one arg per digest
          docker buildx imagetools create -t "${CHROMIUM_IMAGE}:${TAG}" \
            $(printf "${CHROMIUM_IMAGE}@sha256:%s " *)
      - run: docker buildx imagetools inspect "${CHROMIUM_IMAGE}:${TAG}"
